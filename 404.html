<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#09283b">
    <title>Página não encontrada | Marina Domingos</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <style>
      :root { --ink:#09283b; --blue:#2f779e; --paper:#fbfaf7; --line:rgba(9,40,59,.16); }
      * { box-sizing:border-box; }
      body { min-height:100svh; display:grid; place-items:center; margin:0; padding:2rem; background:linear-gradient(135deg,#eaf4f7,#f1ece4); color:var(--ink); font-family:"Segoe UI",Arial,sans-serif; }
      main { width:min(100%,48rem); border:1px solid var(--line); border-radius:2rem; background:rgba(255,255,255,.88); box-shadow:0 28px 80px rgba(7,31,45,.12); padding:clamp(2rem,7vw,5rem); }
      .eyebrow { margin:0 0 1.2rem; color:var(--blue); font-size:.74rem; font-weight:800; letter-spacing:.17em; text-transform:uppercase; }
      h1 { margin:0; font-size:clamp(2.6rem,7vw,5rem); letter-spacing:-.05em; line-height:1; }
      p:not(.eyebrow) { max-width:36rem; margin:1.4rem 0 2rem; color:#274657; line-height:1.65; }
      a { display:inline-flex; min-height:3.4rem; align-items:center; justify-content:center; border-radius:999px; background:var(--ink); color:#fff; padding:.9rem 1.4rem; text-decoration:none; font-weight:750; }
      a:hover { background:var(--blue); }
      a:focus-visible { outline:3px solid #f3b14c; outline-offset:4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Erro 404</p>
      <h1>Esta página não foi encontrada.</h1>
      <p>O endereço pode ter mudado. Volte para o início ou fale diretamente com Marina para encontrar o serviço adequado.</p>
      <a id="home-link" href="./">Voltar ao início</a>
    </main>
    <script>
      const link = document.getElementById("home-link");
      if (location.hostname.endsWith("github.io")) {
        const repository = location.pathname.split("/").filter(Boolean)[0];
        link.href = repository ? `/${repository}/` : "/";
      } else {
        link.href = "/";
      }
    </script>
  </body>
</html>
